name: Deploy WhatsApp Bot

on:
  push:
    branches: [main]
    paths:
      - "services/whatsapp_bot/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-whatsapp-bot-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DROPLET_HOST: ${{ secrets.DO_DROPLET_HOST }}
      DROPLET_USER: ${{ secrets.DO_DROPLET_USER }}
      DROPLET_SSH_PORT: ${{ vars.DO_DROPLET_SSH_PORT }}
      DEPLOY_PATH: ${{ vars.DO_DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare image name
        id: image
        run: echo "name=$(echo "ghcr.io/${{ github.repository }}/whatsapp-bot" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push whatsapp-bot image
        uses: docker/build-push-action@v6
        with:
          context: ./services/whatsapp_bot
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DO_DROPLET_SSH_KEY }}
        run: |
          set -euo pipefail

          : "${DROPLET_HOST:?Missing secret DO_DROPLET_HOST}"
          : "${DROPLET_USER:?Missing secret DO_DROPLET_USER}"
          : "${SSH_KEY:?Missing secret DO_DROPLET_SSH_KEY}"

          port="${DROPLET_SSH_PORT:-22}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$port" -H "$DROPLET_HOST" >> ~/.ssh/known_hosts

      - name: Sync docker-compose.yml
        run: |
          set -euo pipefail

          port="${DROPLET_SSH_PORT:-22}"
          dest="${DROPLET_USER}@${DROPLET_HOST}"
          path="${DEPLOY_PATH:-/home/root/weather_ansessa_com}"

          scp -P "$port" docker-compose.yml "$dest:$path/docker-compose.yml"

      - name: Deploy WhatsApp bot env vars
        env:
          WA_GROUP_NAME: ${{ vars.WHATSAPP_GROUP_NAME }}
          WA_PHONE_NUMBER: ${{ secrets.WHATSAPP_PHONE_NUMBER }}
        run: |
          set -euo pipefail

          port="${DROPLET_SSH_PORT:-22}"
          dest="${DROPLET_USER}@${DROPLET_HOST}"
          path="${DEPLOY_PATH:-/home/root/weather_ansessa_com}"

          {
            [ -n "${WA_GROUP_NAME}" ] && echo "WHATSAPP_GROUP_NAME=${WA_GROUP_NAME}"
            [ -n "${WA_PHONE_NUMBER}" ] && echo "WHATSAPP_PHONE_NUMBER=${WA_PHONE_NUMBER}"
            true
          } > .env.wa

          scp -P "$port" .env.wa "$dest:$path/.env.wa"
          ssh -p "$port" "$dest" "cd $path && touch .env && while IFS='=' read -r key val; do sed -i \"/^\${key}=/d\" .env; done < .env.wa && cat .env.wa >> .env && rm .env.wa"
          rm -f .env.wa

      - name: Pull and restart whatsapp-bot
        run: |
          set -euo pipefail

          port="${DROPLET_SSH_PORT:-22}"
          dest="${DROPLET_USER}@${DROPLET_HOST}"
          path="${DEPLOY_PATH:-/home/root/weather_ansessa_com}"

          ssh -p "$port" "$dest" "cd $path && docker compose pull whatsapp-bot && docker compose --profile whatsapp up -d --force-recreate whatsapp-bot"
