name: Deploy to DigitalOcean Droplet

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-droplet-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DROPLET_HOST: ${{ secrets.DO_DROPLET_HOST }}
      DROPLET_USER: ${{ secrets.DO_DROPLET_USER }}
      DROPLET_SSH_PORT: ${{ vars.DO_DROPLET_SSH_PORT }}
      DEPLOY_PATH: ${{ vars.DO_DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare image name
        id: image
        run: echo "name=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DO_DROPLET_SSH_KEY }}
        run: |
          set -euo pipefail

          : "${DROPLET_HOST:?Missing secret DO_DROPLET_HOST}"
          : "${DROPLET_USER:?Missing secret DO_DROPLET_USER}"
          : "${SSH_KEY:?Missing secret DO_DROPLET_SSH_KEY}"

          port="${DROPLET_SSH_PORT:-22}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$port" -H "$DROPLET_HOST" >> ~/.ssh/known_hosts

      - name: Copy compose and config files
        run: |
          set -euo pipefail

          port="${DROPLET_SSH_PORT:-22}"
          dest="${DROPLET_USER}@${DROPLET_HOST}"
          path="${DEPLOY_PATH:-/home/root/weather_ansessa_com}"

          ssh -p "$port" "$dest" "mkdir -p $path/lib $path/services/mosquitto"
          scp -P "$port" docker-compose.yml "$dest:$path/docker-compose.yml"
          scp -P "$port" lib/schema.sql "$dest:$path/lib/schema.sql"
          scp -P "$port" services/mosquitto/mosquitto.conf "$dest:$path/services/mosquitto/mosquitto.conf"

      - name: Deploy environment configuration
        env:
          APP_STATION_URL: ${{ vars.STATION_URL }}
          APP_STATION_LAT: ${{ vars.STATION_LAT }}
          APP_STATION_LON: ${{ vars.STATION_LON }}
          APP_STATION_ALTITUDE: ${{ vars.STATION_ALTITUDE }}
          APP_INGEST_INTERVAL_MS: ${{ vars.INGEST_INTERVAL_MS }}
          APP_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APP_OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          APP_INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          set -euo pipefail

          port="${DROPLET_SSH_PORT:-22}"
          dest="${DROPLET_USER}@${DROPLET_HOST}"
          path="${DEPLOY_PATH:-/opt/weather_ansessa_com}"

          # Build .env from GitHub environment secrets and variables
          {
            [ -n "${APP_STATION_URL}" ]          && echo "STATION_URL=${APP_STATION_URL}"
            [ -n "${APP_STATION_LAT}" ]          && echo "STATION_LAT=${APP_STATION_LAT}"
            [ -n "${APP_STATION_LON}" ]          && echo "STATION_LON=${APP_STATION_LON}"
            [ -n "${APP_STATION_ALTITUDE}" ]     && echo "STATION_ALTITUDE=${APP_STATION_ALTITUDE}"
            [ -n "${APP_INGEST_INTERVAL_MS}" ]   && echo "INGEST_INTERVAL_MS=${APP_INGEST_INTERVAL_MS}"
            [ -n "${APP_OPENAI_API_KEY}" ]       && echo "OPENAI_API_KEY=${APP_OPENAI_API_KEY}"
            [ -n "${APP_OPENAI_MODEL}" ]         && echo "OPENAI_MODEL=${APP_OPENAI_MODEL}"
            [ -n "${APP_INGEST_SECRET}" ]        && echo "INGEST_SECRET=${APP_INGEST_SECRET}"
            true
          } > .env.deploy

          scp -P "$port" .env.deploy "$dest:$path/.env"
          rm -f .env.deploy

      - name: Pull new image and restart containers
        run: |
          set -euo pipefail

          port="${DROPLET_SSH_PORT:-22}"
          dest="${DROPLET_USER}@${DROPLET_HOST}"
          path="${DEPLOY_PATH:-/opt/weather_ansessa_com}"

          ssh -p "$port" "$dest" "cd $path && docker compose pull app && docker compose up -d --remove-orphans app"
