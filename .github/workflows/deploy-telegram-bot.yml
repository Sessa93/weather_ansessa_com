name: Deploy Telegram Bot

on:
  push:
    branches: [main]
    paths:
      - "services/telegram_bot/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-telegram-bot-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DROPLET_HOST: ${{ secrets.DO_DROPLET_HOST }}
      DROPLET_USER: ${{ secrets.DO_DROPLET_USER }}
      DROPLET_SSH_PORT: ${{ vars.DO_DROPLET_SSH_PORT }}
      DEPLOY_PATH: ${{ vars.DO_DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare image name
        id: image
        run: echo "name=$(echo "ghcr.io/${{ github.repository }}/telegram-bot" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push telegram-bot image
        uses: docker/build-push-action@v6
        with:
          context: ./services/telegram_bot
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DO_DROPLET_SSH_KEY }}
        run: |
          set -euo pipefail

          : "${DROPLET_HOST:?Missing secret DO_DROPLET_HOST}"
          : "${DROPLET_USER:?Missing secret DO_DROPLET_USER}"
          : "${SSH_KEY:?Missing secret DO_DROPLET_SSH_KEY}"

          port="${DROPLET_SSH_PORT:-22}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$port" -H "$DROPLET_HOST" >> ~/.ssh/known_hosts

      - name: Sync docker-compose.yml
        run: |
          set -euo pipefail

          port="${DROPLET_SSH_PORT:-22}"
          dest="${DROPLET_USER}@${DROPLET_HOST}"
          path="${DEPLOY_PATH:-/home/root/weather_ansessa_com}"

          scp -P "$port" docker-compose.yml "$dest:$path/docker-compose.yml"

      - name: Deploy Telegram bot secrets
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          TG_OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          TG_DAILY_CHAT_IDS: ${{ vars.DAILY_SUMMARY_CHAT_IDS }}
        run: |
          set -euo pipefail

          port="${DROPLET_SSH_PORT:-22}"
          dest="${DROPLET_USER}@${DROPLET_HOST}"
          path="${DEPLOY_PATH:-/home/root/weather_ansessa_com}"

          # Build a snippet with the Telegram bot env vars
          {
            [ -n "${TG_BOT_TOKEN}" ]       && echo "TELEGRAM_BOT_TOKEN=${TG_BOT_TOKEN}"
            [ -n "${TG_OPENAI_KEY}" ]      && echo "OPENAI_API_KEY=${TG_OPENAI_KEY}"
            [ -n "${TG_OPENAI_MODEL}" ]    && echo "OPENAI_MODEL=${TG_OPENAI_MODEL}"
            [ -n "${TG_DAILY_CHAT_IDS}" ]  && echo "DAILY_SUMMARY_CHAT_IDS=${TG_DAILY_CHAT_IDS}"
            true
          } > .env.tg

          # Merge into the existing .env on the droplet (update existing keys, append new ones)
          scp -P "$port" .env.tg "$dest:$path/.env.tg"
          ssh -p "$port" "$dest" "cd $path && touch .env && while IFS='=' read -r key val; do sed -i \"/^\${key}=/d\" .env; done < .env.tg && cat .env.tg >> .env && rm .env.tg"
          rm -f .env.tg

      - name: Pull and restart telegram-bot
        run: |
          set -euo pipefail

          port="${DROPLET_SSH_PORT:-22}"
          dest="${DROPLET_USER}@${DROPLET_HOST}"
          path="${DEPLOY_PATH:-/home/root/weather_ansessa_com}"

          ssh -p "$port" "$dest" "cd $path && docker compose pull telegram-bot && docker compose up -d --force-recreate telegram-bot"
