services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: weather
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./lib/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/weather
      STATION_URL: ${STATION_URL:-http://host.docker.internal:8888}
      # INGEST_SECRET: ${INGEST_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  import-weewx:
    build: .
    profiles: ["import"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/weather
      MARIADB_HOST: ${MARIADB_HOST:-host.docker.internal}
      MARIADB_PORT: ${MARIADB_PORT:-3306}
      MARIADB_USER: ${MARIADB_USER:-weewx}
      MARIADB_PASS: ${MARIADB_PASS:-weewx}
      MARIADB_DB: ${MARIADB_DB:-weewxdb}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["bun", "run", "lib/import-weewx.ts"]
    restart: "no"

volumes:
  pgdata:
