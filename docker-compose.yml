services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: weather
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./lib/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    image: ghcr.io/sessa93/weather_ansessa_com:latest
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - "8083:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/weather
      STATION_URL: ${STATION_URL:-http://host.docker.internal:8888}
      STATION_LAT: ${STATION_LAT:-45.71}
      STATION_LON: ${STATION_LON:-8.79}
      STATION_ALTITUDE: ${STATION_ALTITUDE:-330}
      INGEST_INTERVAL_MS: ${INGEST_INTERVAL_MS:-600000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      INGEST_SECRET: ${INGEST_SECRET:-}
      MQTT_HOST: mosquitto
    dns:
      - "8.8.8.8"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  import-weewx:
    build: .
    profiles: ["import"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/weather
      STATION_LAT: ${STATION_LAT:-45.71}
      STATION_LON: ${STATION_LON:-8.79}
      STATION_ALTITUDE: ${STATION_ALTITUDE:-330}
      MARIADB_HOST: ${MARIADB_HOST:-host.docker.internal}
      MARIADB_PORT: ${MARIADB_PORT:-3306}
      MARIADB_USER: ${MARIADB_USER:-weewx}
      MARIADB_PASS: ${MARIADB_PASS:-weewx}
      MARIADB_DB: ${MARIADB_DB:-weewxdb}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["bun", "run", "lib/import-weewx.ts"]
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./services/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"

  virtual-station:
    build: ./services/virtual_station
    profiles: ["simulator"]
    restart: unless-stopped
    environment:
      PORT: 8888
      SIM_STATION_ALTITUDE: ${STATION_ALTITUDE:-330}
      SIM_UDP_TARGET_HOST: ${SIM_UDP_TARGET_HOST:-udp-listener}
      SIM_UDP_TARGET_PORT: ${SIM_UDP_TARGET_PORT:-22222}
      SIM_BROADCAST_INTERVAL_MS: ${SIM_BROADCAST_INTERVAL_MS:-2500}
      SIM_SCENARIO: ${SIM_SCENARIO:-variable}
    ports:
      - "${SIM_STATION_PORT:-8888}:8888"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8888/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  udp-listener:
    image: ghcr.io/sessa93/weather_ansessa_com/udp-listener:latest
    build: ./services/udp_listener
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
    depends_on:
      - mosquitto
    ports:
      - "22222:22222/udp"

  telegram-bot:
    image: ghcr.io/sessa93/weather_ansessa_com/telegram-bot:latest
    build: ./services/telegram_bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${TELEGRAM_BOT_PORT:-8084}:8080"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/weather
      STATION_ID: ${STATION_ID:-jerago}
      STATION_NAME: ${STATION_NAME:-Jerago con Orago, Italy}
      STATION_LAT: ${STATION_LAT:-45.71}
      STATION_LON: ${STATION_LON:-8.79}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DAILY_SUMMARY_CRON: ${DAILY_SUMMARY_CRON:-0 8 * * *}
      DAILY_SUMMARY_CHAT_IDS: ${DAILY_SUMMARY_CHAT_IDS:-}
      TZ: ${TZ:-Europe/Rome}
    dns:
      - "8.8.8.8"
